<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Login - UPI Shield AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="app-nav" aria-label="Main navigation">
    <a class="app-brand" href="{{ url_for('home') }}">UPI Shield AI</a>
    <div class="app-nav-links">
        <a href="{{ url_for('login') }}">Sign in</a>
        <a href="{{ url_for('register') }}">Create account</a>
    </div>
</nav>

    <h1>🛡️ UPI Shield AI</h1>

    <h2>Login</h2>

    {% if error %}<p role="alert">{{ error }}</p>{% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input type="email"
               name="email"
               placeholder="Email"
               maxlength="254"
               autocomplete="email"
               required>

        <br><br>

        <input type="password"
               name="password"
               placeholder="Password"
               maxlength="128"
               autocomplete="current-password"
               required>

        <br><br>

        <button type="submit">
            Login
        </button>

        <p class="password-reset-help">
            <a class="password-reset-link" href="{{ url_for('forgot_password') }}">Forgot Password?</a>
        </p>

    </form>

</body>
</html>
