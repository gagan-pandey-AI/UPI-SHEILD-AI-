<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password - UPI Shield AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="app-nav" aria-label="Main navigation">
    <a class="app-brand" href="{{ url_for('home') }}">UPI Shield AI</a>
    <div class="app-nav-links">
        <a href="{{ url_for('login') }}">Sign in</a>
        <a href="{{ url_for('register') }}">Create account</a>
    </div>
</nav>
    <main class="container">
        <h1>Reset your password</h1>
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        {% if notice %}<p role="status">{{ notice }}</p>{% endif %}
        <form method="post" action="{{ url_for('forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Registered email</label>
            <input id="email" type="email" name="email" maxlength="254" autocomplete="email" required>
            <button type="submit">Request verification code</button>
        </form>
        <p><a href="{{ url_for('reset_password') }}">I have a verification code</a></p>
        <p><a href="{{ url_for('login') }}">Back to login</a></p>
    </main>
</body>
</html>
