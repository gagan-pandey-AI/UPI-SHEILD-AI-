<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password - UPI Shield AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="app-nav" aria-label="Main navigation">
    <a class="app-brand" href="{{ url_for('home') }}">UPI Shield AI</a>
    <div class="app-nav-links">
        <a href="{{ url_for('login') }}">Sign in</a>
        <a href="{{ url_for('register') }}">Create account</a>
    </div>
</nav>
    <main class="container">
        <h1>Verify code and choose a new password</h1>
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('reset_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Registered email</label>
            <input id="email" type="email" name="email" maxlength="254" autocomplete="email" required>
            <label for="otp">{{ otp_length }}-digit verification code</label>
            <input id="otp" type="text" name="otp" inputmode="numeric" pattern="[0-9]+" maxlength="{{ otp_length }}" autocomplete="one-time-code" required>
            <label for="password">New password (8–128 characters)</label>
            <input id="password" type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required>
            <button type="submit">Verify and change password</button>
        </form>
        <p><a href="{{ url_for('forgot_password') }}">Request another code</a></p>
    </main>
</body>
</html>
