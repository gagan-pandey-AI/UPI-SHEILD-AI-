services:
  - type: web
    name: upi-shield-ai
    runtime: docker
    plan: 1c-2g
    region: singapore
    numInstances: 1
    maxShutdownDelaySeconds: 120
    healthCheckPath: /health/ready
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: FORCE_HTTPS
        value: "true"
      - key: HTTPS_VERIFIED
        value: "false"
      - key: ENABLE_HSTS
        value: "false"
      - key: DATABASE_PATH
        value: /var/data/database.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: BACKUP_DIRECTORY
        value: /var/data/backups
      - key: ENABLE_SCHEDULED_BACKUPS
        value: "true"
      - key: BACKUP_HOUR_UTC
        value: "2"
      - key: BACKUP_MINUTE_UTC
        value: "15"
      - key: BACKUP_RETENTION_COUNT
        value: "30"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
    disk:
      name: upi-shield-ai-data
      mountPath: /var/data
      sizeGB: 1
